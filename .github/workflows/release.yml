name: Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag Name
        id: meta
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build & Push Control API Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-platform
          file: ./ai-platform/deploy/local/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/control-api:latest
            ghcr.io/${{ github.repository }}/control-api:${{ steps.meta.outputs.TAG_NAME }}

      - name: Build & Push Console Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-platform
          file: ./ai-platform/deploy/local/Dockerfile.console
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/console:latest
            ghcr.io/${{ github.repository }}/console:${{ steps.meta.outputs.TAG_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
