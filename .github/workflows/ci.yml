name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: 1. Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-platform/requirements.txt
          pip install flake8 mypy

      - name: Run Flake8 Linting
        run: |
          flake8 ai-platform/apps ai-platform/shared ai-platform/integrations ai-platform/features --max-line-length=120 --ignore=E501,W503,E402

  unit-and-contract-tests:
    name: 2. Unit & Contract Invariant Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-platform/requirements.txt

      - name: Run Pytest Suite with Coverage
        run: |
          cd ai-platform
          python -m pytest tests/ -v --cov=shared --cov=integrations --cov=features --cov=apps --cov-report=term-missing

  security-scan:
    name: 3. Security & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-test:
    name: 4. Container Build Verification
    needs: [unit-and-contract-tests, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Control API Image
        run: |
          docker build -t agw-control-api:ci -f ai-platform/deploy/local/Dockerfile.api ai-platform/

      - name: Build Console Image
        run: |
          docker build -t agw-console:ci -f ai-platform/deploy/local/Dockerfile.console ai-platform/
