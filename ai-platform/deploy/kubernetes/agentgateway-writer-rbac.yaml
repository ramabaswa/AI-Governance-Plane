apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-governance-route-writer
  namespace: agentgateway-system
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - patch
  - apiGroups:
      - agentgateway.dev
    resources:
      - agentgatewaybackends
      - agentgatewaypolicies
    verbs:
      - get
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-governance-route-writer
  namespace: agentgateway-system
subjects:
  - kind: ServiceAccount
    name: control-api
    namespace: ai-governance-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-governance-route-writer
