[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-governance-plane"
version = "0.1.0"
description = "Enterprise AI Governance, Security, and Monitoring Control Plane on top of agentgateway"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0" }
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "PyJWT[crypto]>=2.10.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "SQLAlchemy>=2.0.40,<3.0.0",
    "psycopg[binary]>=3.2.6,<4.0.0",
    "alembic>=1.15.0,<2.0.0",
    "kubernetes>=32.0.0,<35.0.0",
    "httpx>=0.28.0,<1.0.0",
    "opentelemetry-api>=1.28.0,<2.0.0",
    "opentelemetry-sdk>=1.28.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "shared*", "integrations*", "features*"]

[tool.pytest.ini_options]
testpaths = ["tests", "features", "integrations"]
python_files = "test_*.py"
markers = [
    "live_integration: opt-in checks against explicitly configured live services",
]
